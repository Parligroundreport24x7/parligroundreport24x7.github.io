<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin | Parligroundreport 24x7</title>
<style>
:root{--bg:#f6f7f9;--pn:#fff;--tx:#14181f;--mu:#5b6573;--ln:#d9dee5;--bl:#0b3d91;--rd:#c62828}
@media(prefers-color-scheme:dark){:root{--bg:#0f1319;--pn:#171d26;--tx:#eef1f5;--mu:#9aa5b4;--ln:#2a3340;--bl:#4c8dff;--rd:#ff6b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif}
.w{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:8px 0}h2{font-size:19px;margin:0 0 10px}
.m{color:var(--mu);margin:0 0 14px}
.b{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:130px}
button{padding:12px 18px;border:0;border-radius:8px;background:var(--bl);color:#fff;font:600 16px system-ui;margin-top:14px}
button:disabled{opacity:.5}
button.g{background:transparent;color:var(--mu);border:1px solid var(--ln)}
button.d{background:var(--rd);padding:7px 12px;margin:0;font-size:14px;flex:none}
.r{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--ln)}
.r span{overflow-wrap:anywhere}
.ok{color:#1b8a3a;margin-top:10px}.er{color:var(--rd);margin-top:10px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="w">
<h1>Admin Panel</h1>
<p class="m">Sirf aapke liye. Is page ka link kisi ko mat dijiye.</p>

<div id="login" class="b">
<h2>Login</h2>
<label for="tk">GitHub token</label>
<input id="tk" type="password" autocomplete="off" placeholder="github_pat_...">
<button id="go">Login</button>
<div id="ls"></div>
</div>

<div id="app" hidden>
<div class="b">
<h2>Nayi post</h2>
<label for="type">Type</label>
<select id="type">
<option value="news">Khabar (photo ke saath)</option>
<option value="reel">Instagram Reel</option>
</select>
<div id="fnews">
<label for="cat">Category</label>
<select id="cat">
<option value="parli">Parli</option><option value="beed">Beed</option><option value="maharashtra">Maharashtra</option><option value="rajneeti">Rajneeti</option><option value="desh">Desh</option><option value="videsh">Videsh</option><option value="crime">Crime</option><option value="shiksha">Shiksha</option><option value="khel">Khel</option><option value="manoranjan">Manoranjan</option><option value="business">Business</option><option value="technology">Technology</option>
</select>
<label for="title">Headline</label>
<input id="title" maxlength="200">
<label for="body">Khabar</label>
<textarea id="body"></textarea>
<label for="photo">Photo (optional)</label>
<input id="photo" type="file" accept="image/*">
</div>
<div id="freel" hidden>
<label for="reel">Instagram reel ka link</label>
<input id="reel" inputmode="url" placeholder="https://www.instagram.com/reel/...">
</div>
<button id="pub">Publish karein</button>
<div id="st"></div>
</div>

<div class="b">
<h2>Published posts</h2>
<div id="list"></div>
</div>
<button id="out" class="g">Logout</button>
</div>
</div>

<script>
var OWNER='Parligroundreport24x7',REPO='parligroundreport24x7.github.io';
var API='https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/';
var $=function(i){return document.getElementById(i)};
function tk(){try{return localStorage.getItem('pgr_tk')||''}catch(e){return ''}}
function hdr(j){var h={'Authorization':'Bearer '+tk(),'Accept':'application/vnd.github+json'};if(j)h['Content-Type']='application/json';return h}
function st(m,bad){var s=$('st');s.textContent=m;s.className=bad?'er':'ok'}
function b64(s){return btoa(unescape(encodeURIComponent(s)))}
function unb64(s){return decodeURIComponent(escape(atob(s.replace(/\s/g,''))))}
async function gh(path,opt){
  var r=await fetch(API+path,opt||{headers:hdr()});
  if(r.status===404)return null;
  if(!r.ok){var t='';try{t=(await r.json()).message}catch(e){}throw new Error(r.status+' '+t)}
  return r.json();
}
async function put(path,obj){return gh(path,{method:'PUT',headers:hdr(1),body:JSON.stringify(obj)})}
async function getPosts(){
  var f=await gh('posts.json?ref=main&t='+Date.now());
  if(!f)return{sha:null,list:[]};
  var l=[];try{l=JSON.parse(unb64(f.content))}catch(e){}
  return{sha:f.sha,list:l};
}
function savePosts(sha,list,msg){
  var o={message:msg,content:b64(JSON.stringify(list,null,1)),branch:'main'};
  if(sha)o.sha=sha;
  return put('posts.json',o);
}
function shrink(file){
  return new Promise(function(res,rej){
    var im=new Image(),u=URL.createObjectURL(file);
    im.onload=function(){
      var s=Math.min(1,1280/im.width),c=document.createElement('canvas');
      c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(u);
      res(c.toDataURL('image/jpeg',0.8).split(',')[1]);
    };
    im.onerror=function(){rej(new Error('Photo nahi khuli'))};
    im.src=u;
  });
}
function show(on){$('login').hidden=on;$('app').hidden=!on;if(on)load()}
$('go').onclick=async function(){
  var v=$('tk').value.trim(),b=this;
  if(!v){$('ls').textContent='Token daaliye.';$('ls').className='er';return}
  b.disabled=true;
  try{localStorage.setItem('pgr_tk',v)}catch(e){}
  try{await getPosts();$('tk').value='';show(true)}
  catch(e){try{localStorage.removeItem('pgr_tk')}catch(x){}$('ls').textContent='Token sahi nahi hai ('+e.message+')';$('ls').className='er'}
  b.disabled=false;
};
$('out').onclick=function(){try{localStorage.removeItem('pgr_tk')}catch(e){}show(false)};
$('type').onchange=function(){var n=this.value==='news';$('fnews').hidden=!n;$('freel').hidden=n};
$('pub').onclick=async function(){
  var t=$('type').value,btn=this;
  btn.disabled=true;st('');
  try{
    var id=Date.now().toString(36),post={id:id,type:t,date:new Date().toISOString().slice(0,10)};
    if(t==='news'){
      var ti=$('title').value.trim();
      if(!ti)throw new Error('Headline likhiye');
      post.cat=$('cat').value;post.title=ti;post.body=$('body').value.trim();
      var f=$('photo').files[0];
      if(f){
        st('Photo upload ho rahi hai...');
        var d=await shrink(f);
        await put('images/'+id+'.jpg',{message:'photo '+id,content:d,branch:'main'});
        post.img='images/'+id+'.jpg';
      }
    }else{
      var m=$('reel').value.match(/instagram\.com\/(?:[^\/?#]+\/)?(?:reel|reels|p)\/([A-Za-z0-9_-]+)/);
      if(!m)throw new Error('Reel ka sahi link daaliye');
      post.reel=m[1];post.title='Reel';
    }
    st('Publish ho raha hai...');
    var c=await getPosts();
    c.list.unshift(post);
    await savePosts(c.sha,c.list,'new '+t+' '+id);
    st('Ho gaya! Website par 1-2 minute mein dikhega.');
    ['title','body','reel','photo'].forEach(function(k){$(k).value=''});
    load();
  }catch(e){st('Error: '+e.message,1)}
  btn.disabled=false;
};
async function load(){
  var l=$('list');l.textContent='Load ho raha hai...';
  try{
    var c=await getPosts();l.textContent='';
    if(!c.list.length){l.textContent='Abhi koi post nahi.';return}
    c.list.forEach(function(p){
      var r=document.createElement('div');r.className='r';
      var s=document.createElement('span');
      s.textContent=(p.type==='reel'?'Reel ':'Khabar ')+(p.type==='reel'?p.reel:p.title)+' ('+p.date+')';
      var b=document.createElement('button');b.className='d';b.textContent='Delete';
      b.onclick=function(){del(p.id)};
      r.appendChild(s);r.appendChild(b);l.appendChild(r);
    });
  }catch(e){l.textContent='Error: '+e.message}
}
async function del(id){
  if(!confirm('Ye post hatani hai?'))return;
  try{
    var c=await getPosts(),p=c.list.find(function(x){return x.id===id});
    c.list=c.list.filter(function(x){return x.id!==id});
    await savePosts(c.sha,c.list,'delete '+id);
    if(p&&p.img){
      var f=await gh(p.img+'?ref=main');
      if(f)await gh(p.img,{method:'DELETE',headers:hdr(1),body:JSON.stringify({message:'delete image',sha:f.sha,branch:'main'})});
    }
    load();
  }catch(e){alert('Error: '+e.message)}
}
if(tk())show(true);
</script>
</body>
</html>
