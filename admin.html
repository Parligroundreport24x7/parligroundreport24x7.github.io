<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Admin | Parligroundreport 24x7</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#f6f7f9;color:#14181f}
.w{max-width:600px;margin:auto;padding:14px}h1{font-size:24px;margin:6px 0;color:#0b3d91}
.b{background:#fff;border:1px solid #d9dee5;border-radius:10px;padding:14px;margin-bottom:14px}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1px solid #d9dee5;border-radius:8px;font:inherit;background:#fff;color:#14181f}
textarea{min-height:150px}input[type=checkbox]{width:auto;margin-right:8px}
button{padding:12px 16px;border:0;border-radius:8px;background:#0b3d91;color:#fff;font:600 16px system-ui;margin-top:14px;width:100%}
button:disabled{opacity:.5}button.s{width:auto;padding:7px 12px;margin:6px 6px 0 0;font-size:13px;background:#5b6573}button.d{background:#c62828}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;position:sticky;top:0;background:#f6f7f9;padding:6px 0;z-index:5}
.tabs button{width:auto;white-space:nowrap;margin:0;padding:9px 13px;font-size:14px;background:#dfe4ec;color:#14181f}.tabs button.on{background:#0b3d91;color:#fff}
.it{border-top:1px solid #d9dee5;padding:9px 0;font-size:14px;word-break:break-word}.it small{color:#5b6573}
#msg{position:fixed;left:10px;right:10px;bottom:10px;background:#14181f;color:#fff;padding:12px;border-radius:8px;display:none;text-align:center;z-index:9}
[hidden]{display:none!important}
</style></head><body><div class="w">
<h1>Admin Panel</h1>
<div id="lg" class="b"><p style="margin:0;color:#5b6573">Sirf aapke liye. Is page ka link kisi ko mat dijiye.</p><label>Email</label><input id="em" type="email" autocomplete="username"><label>Password</label><input id="pw" type="password" autocomplete="current-password"><button id="li">Login</button></div>
<div id="ap" hidden>
<div class="tabs"><button data-t="np" class="on">Nayi post</button><button data-t="kh" id="tk">Khabrein</button><button data-t="br" id="tb">Breaking</button><button data-t="rl" id="tr">Videos</button><button data-t="se">Settings</button></div>

<div id="np" class="b"><b id="ft0">Nayi post</b>
<label>Type</label><select id="ty"><option value="news">Khabar (photo ke saath)</option><option value="breaking">Breaking (ticker)</option><option value="vfile">Video / Reel (apni upload)</option></select>
<div id="fn"><label>Category</label><select id="ca">
<option value="parli">Parli News</option><option value="beed">Beed News</option><option value="maharashtra">Maharashtra</option><option value="india">India News</option><option value="politics">Politics</option><option value="crime">Crime News</option><option value="accident">Accident News</option><option value="education">Education</option><option value="schemes">Govt Schemes</option><option value="business">Business</option><option value="sports">Sports</option><option value="entertainment">Entertainment</option><option value="public">Public Issues</option><option value="special">Special Reports</option></select>
<label>Jagah (optional)</label><input id="pl" placeholder="Parli Vaijnath"></div>
<div id="ft"><label>Headline</label><input id="ti" maxlength="200"></div>
<div id="fb"><label>Khabar</label><textarea id="bo"></textarea><label>Photo (optional)</label><input id="ph" type="file" accept="image/*"></div>
<div id="fv" hidden><label>Video (max 100 MB, chhoti reel best)</label><input id="vd" type="file" accept="video/*"><div id="up" style="font-size:14px;margin-top:6px"></div></div>
<div id="fo"><label>Status</label><select id="st"><option value="publish">Publish</option><option value="draft">Draft (abhi mat dikhao)</option></select>
<label>Schedule (optional, baad ka time)</label><input id="sc" type="datetime-local">
<label><input id="tp" type="checkbox">Top Story banao</label></div>
<button id="pb">Publish karein</button><button id="cx" class="s" hidden style="margin-top:10px">Edit cancel karo</button></div>

<div id="kh" class="b" hidden><b>Khabrein</b><input id="q" placeholder="Headline se dhundho..." style="margin-top:8px"><div id="ls"></div><button id="mo" class="s" hidden>Aur dikhao</button></div>
<div id="br" class="b" hidden><b>Breaking (ticker) ki list</b><div id="lb"></div></div>
<div id="rl" class="b" hidden><b>Reels / Videos</b><div id="lr"></div></div>
<div id="se" class="b" hidden><b>Settings</b><p style="font-size:14px;color:#5b6573;margin:6px 0">Purani khabrein (posts.json): ek hi baar dabao. Wo is panel me aa jayengi, phir unhe edit ya delete kar sakoge.</p><button id="im" class="s">Purani khabrein import karo</button></div>
<button id="lo" class="s">Logout</button>
</div></div><div id="msg"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import{getFirestore,collection,addDoc,getDocs,deleteDoc,updateDoc,doc}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyCNavyIi5Zmw6C_w1zcJtrv9zh2xfkxV8o",authDomain:"parligroundreport-d8b0f.firebaseapp.com",projectId:"parligroundreport-d8b0f",storageBucket:"parligroundreport-d8b0f.firebasestorage.app",messagingSenderId:"68523898769",appId:"1:68523898769:web:74c5192f0d0769e2bf4c30"});
const auth=getAuth(app),db=getFirestore(app),$=i=>document.getElementById(i);
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const m=t=>{const e=$("msg");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",4000)};
let editId=null,A=[],cache={},lim=10;
const key=p=>(p.date||"")+"|"+(p.title||p.reel||"");
function tab(t){document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x.dataset.t===t));["np","kh","br","rl","se"].forEach(id=>$(id).hidden=id!==t);window.scrollTo(0,0)}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>tab(b.dataset.t));
$("li").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("em").value.trim(),$("pw").value)}catch(e){m("Email ya password galat hai")}};
$("lo").onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{$("lg").hidden=!!u;$("ap").hidden=!u;if(u)load()});
$("ty").onchange=()=>{const t=$("ty").value;$("fn").hidden=t!=="news";$("fb").hidden=t!=="news";$("fv").hidden=t!=="vfile";$("ft").hidden=false;$("fo").hidden=false};
function upVideo(f){return new Promise((ok,no)=>{const x=new XMLHttpRequest(),fd=new FormData();fd.append("file",f);fd.append("upload_preset","pgr_news");x.open("POST","https://api.cloudinary.com/v1_1/h87lzxgl/video/upload");x.upload.onprogress=e=>{if(e.lengthComputable)$("up").textContent="Video upload ho rahi hai: "+Math.round(e.loaded/e.total*100)+"%"};x.onload=()=>{try{const j=JSON.parse(x.responseText);j.secure_url?ok(j.secure_url):no(new Error((j.error&&j.error.message)||"Video upload nahi hui"))}catch(e){no(new Error("Video upload nahi hui"))}};x.onerror=()=>no(new Error("Internet ya network ki dikkat"));x.send(fd)})}
function endEdit(){editId=null;["ti","bo","pl","vd","ph","sc"].forEach(i=>$(i).value="");$("tp").checked=false;$("ty").disabled=false;$("pb").textContent="Publish karein";$("ft0").textContent="Nayi post";$("cx").hidden=true;load()}
$("cx").onclick=()=>{endEdit();tab("kh")};
$("pb").onclick=async()=>{
 const t=$("ty").value,b=$("pb"),was=editId;b.disabled=true;
 try{
  const p={type:t,status:"publish",date:new Date().toISOString()};
  {
   const ti=$("ti").value.trim();if(!ti)throw new Error("Headline likhiye");p.title=ti;
   p.status=$("st").value;if($("sc").value)p.date=new Date($("sc").value).toISOString();
   if(t==="vfile"){const f=$("vd").files[0];if(!f&&!editId)throw new Error("Video chuniye");if(f){if(f.size>100*1024*1024)throw new Error("Video 100 MB se badi hai, chhoti karke daaliye");b.textContent="Upload ho raha hai...";p.video=await upVideo(f)}}
   if(t==="news"){
    p.cat=$("ca").value;p.place=$("pl").value.trim();p.body=$("bo").value.trim();p.top=$("tp").checked;
    const f=$("ph").files[0];
    if(f){b.textContent="Photo upload ho rahi hai...";const fd=new FormData();fd.append("file",f);fd.append("upload_preset","pgr_news");
     const r=await fetch("https://api.cloudinary.com/v1_1/h87lzxgl/image/upload",{method:"POST",body:fd});
     const j=await r.json();if(!j.secure_url)throw new Error("Photo upload nahi hui");p.img=j.secure_url}
   }
  }
  b.textContent="Save ho raha hai...";
  if(editId){if(!$("sc").value)delete p.date;await updateDoc(doc(db,"posts",editId),p);m("Update ho gayi!")}
  else{await addDoc(collection(db,"posts"),p);m("Ho gaya! Website par turant dikhegi.")}
  endEdit();if(was)tab("kh");
 }catch(e){m("Error: "+e.message)}
 b.disabled=false;b.textContent=editId?"Update karein":"Publish karein";
};
function startEdit(id){
 const p=cache[id];if(!p)return;editId=id;
 $("ty").value=p.type||"news";$("ty").onchange();$("ty").disabled=true;
 $("ti").value=p.title||"";$("bo").value=p.body||"";$("pl").value=p.place||"";
 if(p.cat)$("ca").value=p.cat;$("st").value=p.status==="draft"?"draft":"publish";$("tp").checked=!!p.top;
 $("pb").textContent="Update karein";$("ft0").textContent="Khabar edit ho rahi hai";$("cx").hidden=false;tab("np");
 m("Badlav karke Update dabao. Nayi photo na chuno to purani rahegi.");
}
$("im").onclick=async()=>{
 const b=$("im");b.disabled=true;
 try{
  const r=await fetch("posts.json?v="+Date.now());if(!r.ok)throw new Error("posts.json nahi mili");
  const old=await r.json();if(!Array.isArray(old))throw new Error("posts.json ka format alag hai");
  const s=await getDocs(collection(db,"posts"));const have=new Set(s.docs.map(d=>d.data().from).filter(Boolean));
  let n=0;
  for(const p of old){const k=key(p);if(have.has(k))continue;const o={};Object.keys(p).forEach(x=>{if(p[x]!==undefined&&x!=="id")o[x]=p[x]});o.from=k;if(!o.status)o.status="publish";await addDoc(collection(db,"posts"),o);n++}
  m(n?n+" purani khabrein import ho gayi":"Sab pehle se import hain");load();
 }catch(e){m("Error: "+e.message)}
 b.disabled=false;
};
async function load(){
 const s=await getDocs(collection(db,"posts"));
 A=s.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.status!=="deleted").sort((x,y)=>new Date(y.date)-new Date(x.date));
 cache={};A.forEach(p=>cache[p.id]=p);draw();
}
const isN=p=>(p.type||"news")==="news",isB=p=>p.type==="breaking";
function item(p){
 const ed=isN(p)||isB(p)||p.type==="vfile",name=p.type==="reel"?"Reel "+p.reel:(p.title||"(bina headline)");
 return `<div class="it"><b>${esc(name)}</b><br><small>${esc(p.type||"news")} | ${p.status==="draft"?"Draft":"Publish"}${p.top?" | Top":""} | ${esc((p.date||"").slice(0,10))}</small><br>
 ${ed?`<button class="s" data-id="${p.id}" data-a="ed">Edit</button><button class="s" data-id="${p.id}" data-a="st" data-v="${p.status}">${p.status==="draft"?"Publish karo":"Draft karo"}</button>`:""}
 ${isN(p)?`<button class="s" data-id="${p.id}" data-a="tp" data-v="${p.top?1:0}">${p.top?"Top hatao":"Top banao"}</button>`:""}
 <button class="s d" data-id="${p.id}" data-a="del">Delete</button></div>`;
}
function draw(){
 const q=$("q").value.trim().toLowerCase();
 const nw=A.filter(isN),all=nw.filter(p=>!q||(p.title||"").toLowerCase().includes(q));
 $("ls").innerHTML=all.slice(0,lim).map(item).join("")||"<p>Koi khabar nahi mili.</p>";$("mo").hidden=all.length<=lim;
 const br=A.filter(isB),rl=A.filter(p=>!isN(p)&&!isB(p));
 $("lb").innerHTML=br.map(item).join("")||"<p>Abhi koi breaking nahi.</p>";
 $("lr").innerHTML=rl.map(item).join("")||"<p>Abhi koi reel nahi.</p>";
 $("tk").textContent="Khabrein ("+nw.length+")";$("tb").textContent="Breaking ("+br.length+")";$("tr").textContent="Videos ("+rl.length+")";
}
$("q").oninput=()=>{lim=10;draw()};
$("mo").onclick=()=>{lim+=10;draw()};
async function act(e){
 const b=e.target.closest("button");if(!b||!b.dataset.a)return;const r=doc(db,"posts",b.dataset.id);
 try{
  if(b.dataset.a==="ed")return startEdit(b.dataset.id);
  if(b.dataset.a==="del"){if(!confirm("Pakka delete karna hai?"))return;const c=cache[b.dataset.id];if(c&&c.from)await updateDoc(r,{status:"deleted"});else await deleteDoc(r)}
  if(b.dataset.a==="st")await updateDoc(r,{status:b.dataset.v==="draft"?"publish":"draft"});
  if(b.dataset.a==="tp")await updateDoc(r,{top:b.dataset.v!=="1"});
  load();
 }catch(x){m("Error: "+x.message)}
}
$("ls").onclick=act;$("lb").onclick=act;$("lr").onclick=act;
</script></body></html>
